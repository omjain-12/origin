spring:
  application:
    name: ramlaal

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ramlaal}
    username: ${POSTGRES_USER:ramlaal}
    password: ${POSTGRES_PASSWORD:ramlaal_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Spring AI: OpenAI-compatible (AWS Bedrock Mantle) ─────────────────────
  ai:
    openai:
      api-key: ${API_KEY}
      base-url: ${BASE_URL:https://bedrock-mantle.us-east-1.api.aws/v1}
      chat:
        options:
          model: ${CHAT_MODEL:openai/zai.glm-5}
          temperature: 0.7
      embedding:
        options:
          model: ${EMBEDDING_MODEL:openai/zai.glm-4.7}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

logging:
  level:
    com.ramlaal: DEBUG
    org.springframework.ai: INFO

ramlaal:
  documents:
    scan-directory: ./data/documents
  retrieval:
    top-k: 5
    chunk-size: 500
    chunk-overlap: 50
  memory:
    user-id: default-user
  models:
    planning: ${PLANNING_MODELS:openai/zai.glm-5}
    fast: ${FAST_CHAT_MODEL:openai/zai.glm-4.7-flash}
    full: ${EXECUTION_MODELS_FULL:openai/zai.glm-5}
